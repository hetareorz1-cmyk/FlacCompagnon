name: Build Intel macOS App

on:
  workflow_dispatch:

jobs:
  build-intel:
    runs-on: macos-15-intel

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install macOS build dependencies
        run: |
          brew install autoconf automake libtool
          brew link --overwrite automake

      - name: Check build tools
        run: |
          which autoconf
          which automake
          which aclocal
          which libtool
          aclocal --version

      - name: Install dependencies
        run: npm install

      - name: Build Intel App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-apple-darwin --bundles app

      - name: Find Intel App
        id: find-app
        run: |
          APP_PATH=$(find src-tauri/target -type d -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Intel App
        uses: actions/upload-artifact@v4
        with:
          name: FlacCompagnon-Intel-App
          path: ${{ steps.find-app.outputs.app_path }}
          if-no-files-found: error
