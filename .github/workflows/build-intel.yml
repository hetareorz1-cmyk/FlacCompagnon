name: "Release Build"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Web画面から手動実行できるようにする

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Apple Silicon (M1/M2/M3/M4) 用 ---
          - platform: 'macos-latest' # または macos-14
            target: 'aarch64-apple-darwin'
          
          # --- Intel Mac (x86_64) 用 ★ここを追加★ ---
          - platform: 'macos-13'     # macOS 13 (Intelランナー) を指定
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (pnpm/npm/yarn)
        run: |
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'FlacCompagnon v__VERSION__'
          releaseBody: 'See the assets below to download the application.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
