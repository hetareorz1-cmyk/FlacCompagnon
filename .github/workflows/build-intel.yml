name: Build Intel macOS DMG

on:
  workflow_dispatch:

jobs:
  build-intel:
    runs-on: macos-15-intel

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install macOS build dependencies
        run: |
          brew install autoconf automake libtool
          brew link --overwrite automake

      - name: Check build tools
        run: |
          which autoconf
          which automake
          which aclocal
          which libtool
          aclocal --version

      - name: Install dependencies
        run: npm install

      - name: Build Intel DMG
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-apple-darwin --bundles dmg

      - name: Find and prepare Intel DMG
        run: |
          DMG_PATH=$(find . -type f -name "*.dmg" -print -quit)

          if [ -z "$DMG_PATH" ]; then
            echo "ERROR: .dmg was not found"
            echo "Searching for bundle files..."
            find . -path "*/bundle/*" -maxdepth 10 -print
            exit 1
          fi

          echo "Found: $DMG_PATH"

          cp "$DMG_PATH" "$RUNNER_TEMP/FlacCompagnon-Intel.dmg"

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: FlacCompagnon-Intel-DMG
          path: ${{ runner.temp }}/FlacCompagnon-Intel.dmg
          if-no-files-found: error
