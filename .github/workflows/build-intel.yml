name: Build Intel macOS DMG

on:
  workflow_dispatch:

jobs:
  build-intel-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install build dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build Intel DMG
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Find and collect DMG
        shell: bash
        run: |
          set -e
          echo "Searching for generated DMG files..."
          find . -type f -name "*.dmg" -print
          mkdir -p artifacts
          find . -type f -name "*.dmg" -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name "*.dmg" -print -quit)"
          echo "Collected:"
          ls -lh artifacts/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FlacCompagnon-Intel-macOS
          path: artifacts/*.dmg
          if-no-files-found: error
